name: CI/CD Pipeline

on:
  push:
    branches: [ "production" ]
    paths:
      - '.github/workflows/**'
      - 'app/**'
      - 'core/**'
      - 'db/**'
      - 'alembic/**'
      - 'alembic.ini'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'create_super_admin.py'
      - 'entrypoint.sh'
  pull_request:
    branches: [ "production" ]
    paths:
      - '.github/workflows/**'
      - 'app/**'
      - 'core/**'
      - 'db/**'
      - 'alembic/**'
      - 'alembic.ini'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'create_super_admin.py'
      - 'entrypoint.sh'

env:
  ECR_REPOSITORY: project/backend

jobs:
  verify:
    name: Verifica Codice Backend
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8

    - name: Lint with flake8
      run: |
        # Ferma la build se ci sono errori di sintassi o nomi non definiti
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero tratta tutti gli errori come warning
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Build Docker image
      run: docker build -t backend-test .

  push-to-ecr:
    name: Build e Push su ECR
    needs: verify
    runs-on: ubuntu-latest
    environment: "AWS image deploy"
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

    - name: Force ECS Update
      run: |
        # Verifica se lo stack CloudFormation esiste
        if ! aws cloudformation describe-stacks --stack-name EcsMultiContainerStack >/dev/null 2>&1; then
          echo "Stack CloudFormation EcsMultiContainerStack non trovato. Salto l'aggiornamento ECS."
          exit 0
        fi

        CLUSTER=$(aws ecs list-clusters --query 'clusterArns[0]' --output text)
        if [ -z "$CLUSTER" ] || [ "$CLUSTER" = "None" ]; then
          echo "Nessun cluster ECS trovato. Salto l'aggiornamento."
          exit 0
        fi

        SERVICE=$(aws ecs list-services --cluster $CLUSTER --query 'serviceArns[0]' --output text)
        if [ -z "$SERVICE" ] || [ "$SERVICE" = "None" ]; then
          echo "Nessun servizio ECS trovato nel cluster $CLUSTER. Salto l'aggiornamento."
          exit 0
        fi

        echo "Updating ECS Service $SERVICE on Cluster $CLUSTER"
        aws ecs update-service --cluster $CLUSTER --service $SERVICE --force-new-deployment
